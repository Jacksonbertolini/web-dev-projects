name: CI

on:
  push:
    branches: [module-2-submission]
  pull_request:
    branches: [module-2-submission]

jobs:
  backend:
    name: Build & Vet Go Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: jones-county-xc/backend/go.sum

      - name: Download dependencies
        run: go mod download
        working-directory: jones-county-xc/backend

      - name: Build
        run: go build ./...
        working-directory: jones-county-xc/backend

      - name: Vet
        run: go vet ./...
        working-directory: jones-county-xc/backend

  frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: jones-county-xc/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: jones-county-xc/frontend

      - name: Build
        run: npm run build
        working-directory: jones-county-xc/frontend
