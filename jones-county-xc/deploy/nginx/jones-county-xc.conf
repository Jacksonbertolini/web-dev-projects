# Module 2 - Jones County XC
# Add this INSIDE your existing server block (don't create a new one)
# so it lives alongside the Module 1 /module1/ location

# Proxy Module 2 API requests to Go backend
location /module2/api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Serve Module 2 React frontend
location /module2/ {
    alias /var/www/module2/;
    index index.html;
    try_files $uri $uri/ /module2/index.html;
}
