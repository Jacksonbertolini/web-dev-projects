# Module 3 - Jones County XC
# Add this INSIDE your existing server block alongside the Module 1 and Module 2 locations

# Proxy Module 3 API requests to Go backend (port 8081)
location /module3/api/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Serve Module 3 React frontend
location /module3/ {
    alias /var/www/module3/;
    index index.html;
    try_files $uri $uri/ /module3/index.html;
}
